                    btn.classList.add(...COLORS.navInactive.split(' '));
                    if(icon) icon.setAttribute('stroke-width', '2');

            } else {
                headerContainer.innerHTML = '';

        async function fetchWeatherAndRender() {
            const weatherContainer = document.getElementById('weather-container');
            if (!weatherContainer) return;

            if (state.weatherCache && (Date.now() - state.weatherLastFetched < 600000)) { 
                renderWeatherCards(state.weatherCache);
                return;
            }

            try {
                const promises = CITIES.map(async (city) => {
                    try {
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lng}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4`;
                        const res = await fetch(url);
                        const data = await res.json();
                        if (data.error) throw new Error("API Error");
                        
                        return {
                            ...city,
                            current: {
                                temp: Math.round(data.current.temperature_2m),
                                code: data.current.weather_code,
                            },
                            daily: {
                                max: Math.round(data.daily.temperature_2m_max[0]),
                                min: Math.round(data.daily.temperature_2m_min[0]),
                            }
                        };
                    } catch (e) {
                        return { ...city, error: true };
                    }
                });

                const results = await Promise.all(promises);
                state.weatherCache = results;
                state.weatherLastFetched = Date.now();
                renderWeatherCards(results);

            } catch(e) {
                weatherContainer.innerHTML = '<div class="text-red-400 text-xs p-4">無法載入天氣資訊</div>';
            }
        }

        function renderWeatherCards(data) {
            const container = document.getElementById('weather-container');
            if(!container) return;
            container.innerHTML = '';

            data.forEach(city => {
                const card = document.createElement('div');
                card.className = "min-w-[100px] bg-white p-3 rounded-xl shadow-sm border border-stone-100 flex flex-col items-center justify-between snap-center";
                
                if (city.error) {
                    card.innerHTML = `<p class="font-bold text-xs text-stone-700 mb-2">${city.label}</p><span class="text-[10px] text-red-300">N/A</span>`;
                } else {
                    const iconHTML = getWeatherIcon(city.current.code);
                    card.innerHTML = `
                        <div class="text-center w-full mb-1">
                            <p class="font-bold text-xs text-stone-700">${city.label}</p>
                        </div>
                        <div class="flex flex-col items-center">
                            ${iconHTML}
                            <span class="text-xl font-bold text-stone-800 leading-none mt-1">${city.current.temp}°</span>
                            <div class="flex gap-1 mt-1 text-[10px] text-stone-400">
                                <span class="font-medium">H:${city.daily.max}°</span>
                                <span>L:{city.daily.min}°</span>
                            </div>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function getWeatherIcon(code) {
            let iconName = 'sun';
            let colorClass = 'text-orange-400';
            
            if (code === 0) { iconName = 'sun'; colorClass = 'text-orange-400'; }
            else if (code >= 1 && code <= 3) { iconName = 'cloud'; colorClass = 'text-stone-400'; }
            else if (code >= 45 && code <= 48) { iconName = 'cloud-fog'; colorClass = 'text-slate-400'; }
            else if (code >= 51 && code <= 57) { iconName = 'cloud-drizzle'; colorClass = 'text-blue-300'; }
            else if (code >= 61 && code <= 67) { iconName = 'cloud-rain'; colorClass = 'text-blue-500'; }
            else if (code >= 71 && code <= 77) { iconName = 'snowflake'; colorClass = 'text-cyan-300'; }
            else if (code >= 80 && code <= 82) { iconName = 'cloud-rain'; colorClass = 'text-blue-600'; }
            else if (code >= 95) { iconName = 'cloud-lightning'; colorClass = 'text-yellow-500'; }

            return `<i data-lucide="${iconName}" size="24" class="${colorClass}"></i>`;
        }

        window.updateCurrency = function(type, value) {
            const hkdInput = document.getElementById('hkd-input');
            const madInput = document.getElementById('mad-input');

            if (type === 'hkd') {
                state.hkd = value;
                if (value === '') {
                    state.mad = '';
                    madInput.value = '';
                } else {
                    const converted = (parseFloat(value) * EXCHANGE_RATE).toFixed(1);
                    state.mad = converted;
                    madInput.value = converted;
                }
            } else {
                state.mad = value;
                if (value === '') {
                    state.hkd = '';
                    hkdInput.value = '';
                } else {
                    const converted = (parseFloat(value) / EXCHANGE_RATE).toFixed(1);
                    state.hkd = converted;
                    hkdInput.value = converted;
                }
            }
        }
        
        window.resetCurrency = function() {
            state.hkd = '';
            state.mad = '';
            document.getElementById('hkd-input').value = '';
            document.getElementById('mad-input').value = '';

        window.selectCategory = function(category, btnElement) {

        window.submitExpense = async function() {
            const payer = document.getElementById('userSelector').value;
            const description = document.getElementById('descInput').value || '未分類';
            const amount = parseFloat(document.getElementById('amountInput').value);
            const type = document.querySelector('input[name="expenseType"]:checked').value;
            const btn = document.getElementById('submitBtn');

            if (!amount || amount <= 0) {
                alert("請輸入有效的金額！");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "處理中...";

            try {
                await addDoc(collection(db, "expenses"), {
                    payer, description, amount, type,
                    timestamp: serverTimestamp()
                });
                document.getElementById('amountInput').value = '';
                document.getElementById('descInput').value = '';
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.innerHTML = "新增記帳";
            } catch (error) {
                console.error("Error:", error);
                alert("上傳失敗");
            } finally {
                btn.disabled = false;
            }
        }
        
        window.deleteExpense = async function(id) {
            if (confirm("確定要刪除這筆紀錄嗎？此動作無法復原。")) {

                } catch (e) {

        window.calculateDebts = function() {
            const sharedExpenses = globalExpenses.filter(e => e.type === 'shared');
            let paid = {};
            USERS.forEach(u => paid[u] = 0);
            let totalShared = 0;

            sharedExpenses.forEach(e => {
                if (paid[e.payer] !== undefined) {
                    paid[e.payer] += e.amount;
                    totalShared += e.amount;
                }
            });

            const average = totalShared / USERS.length;
            let balances = USERS.map(u => ({ user: u, balance: paid[u] - average }));

            let debtors = balances.filter(b => b.balance < -0.01).sort((a, b) => a.balance - b.balance);
            let creditors = balances.filter(b => b.balance > 0.01).sort((a, b) => b.balance - a.balance);

            const debtList = document.getElementById('debtList');
            debtList.innerHTML = '';
            
            document.getElementById('modalTotal').innerText = totalShared.toFixed(2);
            document.getElementById('modalAverage').innerText = average.toFixed(2);

            let transactions = [];
            let i = 0, j = 0;

            while (i < debtors.length && j < creditors.length) {
                let debtor = debtors[i];
                let creditor = creditors[j];
                let amount = Math.min(Math.abs(debtor.balance), creditor.balance);
                transactions.push({ from: debtor.user, to: creditor.user, amount: amount });
                debtor.balance += amount;
                creditor.balance -= amount;
                if (Math.abs(debtor.balance) < 0.01) i++;
                if (creditor.balance < 0.01) j++;
            }

            if (transactions.length === 0) {
                debtList.innerHTML = '<li class="text-center text-green-600 font-bold">🎉 目前帳務平衡，無需付款！</li>';
            } else {
                transactions.forEach(t => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-yellow-50 p-3 rounded border border-yellow-200";
                    li.innerHTML = `
                        <span class="font-bold text-red-600">${t.from}</span>
                        <span class="text-gray-400 text-xs mx-2">支付給</span>
                        <span class="font-bold text-green-600">${t.to}</span>
                        <span class="font-mono font-bold text-gray-800 bg-white px-2 py-1 rounded ml-auto">$${t.amount.toFixed(2)}</span>
                    `;
                    debtList.appendChild(li);
                });
            }
            document.getElementById('settlementModal').classList.remove('hidden');
        }

            document.getElementById('settlementModal').classList.add('hidden');

        let unsubscribe = null;
        function bindExpenseListener() {
            if (unsubscribe) unsubscribe();
            const q = query(collection(db, "expenses"), orderBy("timestamp", "desc"));
            unsubscribe = onSnapshot(q, (snapshot) => {
                globalExpenses = [];
                let groupTotal = 0;
                const historyList = document.getElementById('historyList');
                const totalDisplay = document.getElementById('groupTotalDisplay');

                if (!historyList) return;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    // Store doc ID in the object for deletion
                    globalExpenses.push({ ...data, id: doc.id });
                    if (data.type === 'shared') groupTotal += data.amount;
                });

                if (totalDisplay) totalDisplay.innerText = groupTotal.toFixed(2);

                if (snapshot.empty) {
                    historyList.innerHTML = '<li class="text-center text-gray-400 py-4">尚未有記帳資料</li>';
                    return;
                }

                historyList.innerHTML = '';
                // Show top 20
                globalExpenses.slice(0, 20).forEach(data => {
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleDateString() : '剛剛';
                    const isShared = data.type === 'shared';
                    const rowClass = isShared ? "bg-white" : "bg-gray-50 opacity-75";
                    const badge = isShared 
                        ? `<span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full">公帳</span>` 
                        : `<span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">私帳</span>`;

                    const li = document.createElement('li');
                    li.className = `p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center ${rowClass}`;
                    li.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="bg-gray-100 h-10 w-10 rounded-full flex items-center justify-center text-lg font-bold text-gray-600">
                                ${data.payer.charAt(0)}
                            </div>
                            <div>
                                <div class="font-bold text-gray-800 text-sm">${data.description}</div>
                                <div class="text-xs text-gray-500">${data.payer} • ${date}</div>
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <div>
                                <div class="font-bold text-gray-800">${data.amount.toFixed(2)}</div>
                                <div class="mt-0.5">${badge}</div>
                            </div>
                            <button onclick="deleteExpense('${data.id}')" class="text-gray-300 hover:text-red-500 p-1">
                                <i data-lucide="trash-2" size="16"></i>
                            </button>
                        </div>
                    `;
                    historyList.appendChild(li);
                });
                if (typeof lucide !== 'undefined') lucide.createIcons();
            });
        }

        // --- SHARED HELPER ---
        window.copyToClipboard = function(text) {
            const showToast = () => {
                const toast = document.getElementById('toast');
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2000);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showToast);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {}
                document.body.removeChild(textArea);
            }
        }

        init();
