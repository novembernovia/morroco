                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-full bg-[#CC5544] text-white flex items-center justify-center text-xs font-bold">${data.user?.charAt(0)}</div><div><span class="font-bold text-sm text-stone-800 block">${data.user}</span></div></div>
                        </div>
                        ${data.photo ? `<img src="${data.photo}" class="w-full h-auto object-cover rounded-2xl mb-3 shadow-sm">` : ''}
                        <div class="flex gap-4 mb-2">
                            <button onclick="window.toggleLike('${data.id}')" class="flex items-center gap-1"><i data-lucide="heart" size="18" class="${data.likes?.length > 0 ? 'fill-rose-500 text-rose-500' : 'text-stone-300'}"></i><span class="text-xs font-bold text-stone-400">${data.likes?.length || 0}</span></button>
                        </div>
                        <p class="text-xs font-bold text-stone-800 mb-3 whitespace-pre-wrap leading-relaxed">${data.caption || ''}</p>
                        
                        <div id="commentSection-${data.id}" class="space-y-2 mt-4 pt-4 border-t border-stone-50">
                            <div id="commentsList-${data.id}" class="space-y-1.5">
                                ${(data.comments || []).map(com => `
                                    <div class="text-[10px] bg-stone-50 p-2 rounded-xl flex gap-1">
                                        <span class="font-bold text-[#CC5544]">團友:</span>
                                        <span class="text-stone-600">${com.text}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="flex gap-2 items-center bg-stone-50 p-1.5 rounded-xl">
                                <input id="commentInput-${data.id}" type="text" placeholder="留個言吧..." class="flex-1 text-[11px] bg-transparent outline-none py-0.5 px-1">
                                <button onclick="window.submitComment('${data.id}')" class="text-rose-400 p-1"><i data-lucide="send" size="14"></i></button>
                            </div>
                        </div>`;
                    c.appendChild(div);
                });
                lucide.createIcons();
            });
        };

        window.submitComment = async (id) => {
            const inp = document.getElementById(`commentInput-${id}`);
            const text = inp.value.trim();
            if(!text) return;
            try {
                await updateDoc(doc(db, "daily_reviews", id), {
                    comments: arrayUnion({ text: text, timestamp: Date.now() })
                });
                inp.value = '';
            } catch(e) { alert(e.message); }
        };

        window.saveReview = async (idx) => {
            const u = document.getElementById(`reviewUser-${idx}`).value; const pI = document.getElementById('reviewPhoto-' + idx);
            if(!u) return alert("請選擇名字");
            const btn = document.getElementById('saveReviewBtn-' + idx); btn.disabled = true;
            try {
                const currentDayData = itinerary[idx];
                let caption = ""; 
                for(let i=0; i<currentDayData.reviews.length; i++) { 
                    const qText = currentDayData.reviews[i];
                    const val = document.getElementById(`reviewText-${idx}-${i}`).value; 
                    if(val) caption += (caption ? "\n\n" : "") + qText + "\n答: " + val; 
                }
                let ph = ""; if(pI.files[0]) ph = await new Promise(r => { const r_ = new FileReader(); r_.onload = e => r(e.target.result); r_.readAsDataURL(pI.files[0]); });
                const payL = { dayIndex: idx, user: u, caption, photo: ph, timestamp: serverTimestamp(), likes: [], comments: [] };
                await addDoc(collection(db, "daily_reviews"), payL);
                window.renderItinerary(idx);
            } catch(e) { alert(e.message); } finally { btn.disabled = false; }
        };

        window.toggleLike = async (id) => { const r = window.state.reviewMap[id]; const likes = r.likes || []; const ref = doc(db, "daily_reviews", id); if(likes.includes("團友")) await updateDoc(ref, { likes: arrayRemove("團友") }); else await updateDoc(ref, { likes: arrayUnion("團友") }); };

        window.saveLicensePlate = (v) => localStorage.setItem('licensePlate', v);
        window.handleTrafficPhotoUpload = (input) => { if (input.files[0]) { const reader = new FileReader(); reader.onload = (e) => { localStorage.setItem('trafficPhoto', e.target.result); const container = document.getElementById('traffic-photo-container'); if(container) container.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`; }; reader.readAsDataURL(input.files[0]); } };

        window.addEventListener('load', () => { window.renderApp(); setInterval(window.updateClocks, 1000); });
    </script>
</body>
</html>
