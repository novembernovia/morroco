        // --- IMAGE COMPRESSION ---
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        // Compress to JPEG with 0.7 quality
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

                         previewEl.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-lg" />`;
                         previewEl.dataset.file = "ready"; 
                     }
                }
                reader.readAsDataURL(file);
            }
        }

        window.calculateDebts = function() {
            if (!window.globalExpenses) return;
            
            // Family Definitions
            const FAMILY_A = ['Oscar', 'Emily'];
            const FAMILY_B = ['Eugenie', 'Jasmine', 'YC'];
            const TOTAL_PEOPLE = 5;

            // 1. Calculate Total Shared Expenses & How much each family paid
            const sharedExpenses = window.globalExpenses.filter(e => e.type === 'shared');
            let totalShared = 0;
            let paidByA = 0;
            let paidByB = 0;

            sharedExpenses.forEach(e => {
                totalShared += e.amount;
                if (FAMILY_A.includes(e.payer)) {
                    paidByA += e.amount;
                } else if (FAMILY_B.includes(e.payer)) {
                    paidByB += e.amount;
                }
            });

            // 2. Calculate Fair Share (Per Person)
            const costPerPerson = totalShared / TOTAL_PEOPLE;
            const targetA = costPerPerson * FAMILY_A.length; // 2 people
            const targetB = costPerPerson * FAMILY_B.length; // 3 people

            // 3. Calculate Balance (Positive = Paid more than share, Negative = Paid less)
            const balanceA = paidByA - targetA;
            // balanceB will simply be -balanceA mathematically, but let's calc for clarity
            const balanceB = paidByB - targetB;

            // 4. Update Modal UI
            document.getElementById('modalTotal').innerText = totalShared.toFixed(0);
            document.getElementById('modalAverage').innerText = costPerPerson.toFixed(0);
            const debtList = document.getElementById('debtList');
            debtList.innerHTML = '';

            // 5. Add Family Summary Header
            const summaryDiv = document.createElement('div');
            summaryDiv.className = "mb-4 text-xs text-stone-500 bg-stone-100 p-3 rounded-lg";
            summaryDiv.innerHTML = `
                <div class="flex justify-between mb-1">
                    <span>Oscar & Emily (2人)</span>
                    <span>已付: $${paidByA.toFixed(0)} / 應付: $${targetA.toFixed(0)}</span>
                </div>
                <div class="flex justify-between">
                    <span>YC, Jasmine & Eugenie (3人)</span>
                    <span>已付: $${paidByB.toFixed(0)} / 應付: $${targetB.toFixed(0)}</span>
                </div>
            `;
            debtList.appendChild(summaryDiv);

            // 6. Generate Transaction
            const li = document.createElement('li');
            li.className = "flex justify-between items-center bg-amber-50 p-3 rounded-lg border border-amber-100";
            
            if (Math.abs(balanceA) < 1) {
                li.innerHTML = '<span class="text-green-600 font-bold w-full text-center">🎉 兩家帳目已平衡！</span>';
            } else if (balanceA < 0) {
                // A paid less, A owes B
                li.innerHTML = `
                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-stone-700">Oscar & Emily</span>
                            <i data-lucide="arrow-right" class="text-stone-300" size="14"></i>
                        </div>
                        <span class="font-bold text-stone-700 mt-1">YC, Jasmine & Eugenie</span>
                    </div>
                    <span class="font-bold text-[#CC5544] text-xl">$${Math.abs(balanceA).toFixed(0)}</span>
                `;
            } else {
                // A paid more, B owes A
                li.innerHTML = `
                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-stone-700">YC, Jasmine & Eugenie</span>
                            <i data-lucide="arrow-right" class="text-stone-300" size="14"></i>
                        </div>
                        <span class="font-bold text-stone-700 mt-1">Oscar & Emily</span>
                    </div>

        // --- FETCH WEATHER ---
        async function fetchWeather() {
            const CITIES = [
                { name: 'Casablanca', lat: 33.5731, lng: -7.5898, label: '卡薩布蘭卡' },
                { name: 'Essaouira', lat: 31.5085, lng: -9.7595, label: '索維拉' },
                { name: 'Marrakech', lat: 31.6295, lng: -7.9811, label: '馬拉喀什' },
                { name: 'Merzouga', lat: 31.0802, lng: -4.0134, label: '撒哈拉' },
                { name: 'Fes', lat: 34.0181, lng: -5.0078, label: '菲斯' },
                { name: 'Chefchaouen', lat: 35.1716, lng: -5.2697, label: '舍夫沙萬' },
            ];

            const container = document.getElementById('weather-container');
            if (!container) return;

            try {
                const promises = CITIES.map(async (city) => {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lng}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`;
                    const res = await fetch(url);
                    const data = await res.json();
                    return { ...city, data };
                });

                const results = await Promise.all(promises);
                
                container.innerHTML = results.map(city => {
                    const current = city.data.current;
                    const daily = city.data.daily;
                    const max = Math.round(daily.temperature_2m_max[0]);
                    const min = Math.round(daily.temperature_2m_min[0]);
                    const temp = Math.round(current.temperature_2m);
                    
                    // Simple Icon Logic
                    let icon = 'sun'; 
                    let color = 'text-orange-400';
                    const code = current.weather_code;
                    if (code > 2) { icon = 'cloud'; color = 'text-stone-400'; }
                    if (code > 45) { icon = 'cloud-fog'; color = 'text-slate-400'; }
                    if (code > 50) { icon = 'cloud-drizzle'; color = 'text-blue-300'; }
                    if (code > 60) { icon = 'cloud-rain'; color = 'text-blue-500'; }

                    return `
                        <div class="min-w-[100px] shrink-0 bg-white p-3 rounded-xl shadow-sm border border-stone-100 flex flex-col items-center justify-between snap-center">
                            <div class="text-center w-full mb-2">
                                <p class="font-bold text-sm text-stone-800">${city.label}</p>
                            </div>
                            <i data-lucide="${icon}" class="${color} mb-1" size="24"></i>
                            <span class="text-2xl font-bold text-stone-800 leading-none my-1">${temp}°</span>
                            <div class="flex gap-2 text-xs text-stone-500 font-medium">
                                <span>H:${max}°</span>
                                <span>L:${min}°</span>
                            </div>
                        </div>
                    `;
                }).join('');
                if (typeof lucide !== 'undefined') lucide.createIcons();

            } catch (e) {
                container.innerHTML = '<div class="text-xs text-red-300 p-2">Weather unavailable</div>';
            }
        }

        window.calcCurrency = function(type, value) {
            const RATE = 1.3;
            const hkdEl = document.getElementById('hkdInput');
            const madEl = document.getElementById('madInput');
            if(type === 'reset') {
                hkdEl.value = ''; madEl.value = '';
                return;
            }
            if(value === '') {
                hkdEl.value = ''; madEl.value = '';
                return;
            }
            if(type === 'mad') {
                hkdEl.value = (parseFloat(value) / RATE).toFixed(1);
            } else {
                madEl.value = (parseFloat(value) * RATE).toFixed(1);
            }
        }
